<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GTA-style top-down shooter</title>
    <meta
      name="description"
      content="A dependency-free top-down shooter built with plain HTML, CSS and the Canvas 2D API."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <header class="game__hud">
        <h1 class="game__title">Top-Down Shooter</h1>
        <p class="game__status" id="status">
          Scaffold ready &mdash; game code lands in a later task.
        </p>
      </header>
      <canvas class="game__canvas" id="game" width="960" height="540">
        Your browser does not support the Canvas 2D API.
      </canvas>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
